 return V.filter(r=>VFL.every(f=>{const v=$('#vf-'+f.k).value;return !v||(f.k=='est'?r.est:r.d[f.k])==v})&&(!a||(r.d.fecha||'')>=a)&&(!b||(r.d.fecha||'')<=b)&&hit({...r.d,est:r.est},q))
  .sort((x,y)=>(y.d.fecha||'').localeCompare(x.d.fecha||'')||(y.mod||'').localeCompare(x.mod||''))};
function vupd(){fillSel($('#vf-ts'),uniq('ts'),'Todas');fillSel($('#vf-col'),uniq('col'),'Todas');fillSel($('#vrt'),uniq('ts'),'Todas');fillSel($('#vrc'),uniq('col'),'Todas');
 $('#dl-ts').innerHTML=uniq('ts').map(x=>`<option value="${h(x)}">`).join('');
 $('#dl-col').innerHTML=[...new Set([...uniq('col'),...DB.activos.map(r=>r.col).filter(Boolean)])].sort().map(x=>`<option value="${h(x)}">`).join('');
 $('#dl-part').innerHTML=DB.activos.map(r=>`<option value="${h(r.n)}">`).join('');
 const rs=vfilt();$('#vn').textContent='Visitas: '+rs.length;$('#k-visitas').textContent=V.length;
 $('#vl').innerHTML=rs.length?`<table><thead><tr>${VC.map(c=>`<th>${c[0]}`).join('')}<th>Estado<th></th></tr></thead><tbody>${rs.map(r=>`<tr>${VC.map(c=>`<td data-l="${c[0]}">${h(c[1](r))}`).join('')}<td data-l="Estado"><span class="chip ${r.est=='Completa'?'c':'b'}">${r.est}</span><td><button class="mini" data-vver="${r.id}">Ver</button><button class="mini" data-ved="${r.id}">Editar</button><button class="mini d" data-vrm="${r.id}">Eliminar</button></tr>`).join('')}</tbody></table>`
  :`<p class="vacio">${V.length?'No hay visitas con esta búsqueda o filtros.':'Aún no hay visitas registradas. Toque “Nueva visita” para empezar.'}</p>`;
 const G=[['Por trabajadora social',cntd(rs,r=>r.d.ts||'Sin dato')],['Por colonia',cntd(rs,r=>r.d.col||'Sin dato')],['Por estado',cntd(rs,r=>r.est)],['Visitas por mes',Object.fromEntries(Object.entries(cntd(rs,r=>mlab(r.d.fecha),1)).map(([k,v])=>[mtxt(k),v]))],['Su casa es',cntd(rs,r=>r.d.casa||'Sin dato')],['Servicios con los que NO cuentan',cntd(rs,r=>['Agua','Luz','Drenaje','Internet','Computadora'].filter(x=>!(r.d.serv||[]).includes(x)))]];
 $('#vg').innerHTML=rs.length?G.filter(g=>Object.keys(g[1]).length).map(([l,o])=>bars(l,o)).join(''):'<p class="vacio">No hay visitas con esta búsqueda o filtros.</p>';
 const p=vdraft();$('#vpend').innerHTML=p&&!vcur?`<div class="aviso"><span><b>Captura sin terminar:</b> ${h(vnm(p.d||{}))} · ${new Date(p.t).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</span><span class="gu"><button class="btn sec" data-vx="desc">Descartar</button><button class="btn" data-vx="cont">Continuar</button></span></div>`:'';
 const bk=ls.get('mese_bk'),old=V.length&&(!bk||Date.now()-new Date(bk)>7*864e5);
 $('#vinfo').innerHTML=`<p class="${old?'aviso':'guia'}" style="display:block">Funciona sin internet: las visitas se guardan en este dispositivo (${V.length} guardadas). Último respaldo: <b>${bk?new Date(bk).toLocaleDateString('es-MX',{dateStyle:'medium'}):'nunca'}</b>.${old?' Le recomendamos descargar o enviar un respaldo (abajo, en “Respaldo, exportar e importar”).':''}</p>`;
 vrep()}

/* ---------- Reporte por fecha ---------- */
function vrep(){const a=$('#vr1').value,b=$('#vr2').value,t=$('#vrt').value,c=$('#vrc').value;
 const all=V.filter(r=>(!a||(r.d.fecha||'')>=a)&&(!b||(r.d.fecha||'')<=b)&&(!t||r.d.ts==t)&&(!c||r.d.col==c)),rs=all.filter(r=>r.est=='Completa');
 const pr=fn=>{const xs=rs.map(r=>fn(r.d)).filter(x=>x>0);return xs.length?sm(xs)/xs.length:0};
 const pct=fn=>rs.length?Math.round(rs.filter(r=>fn(r.d)).length/rs.length*100)+'%':'—';
 const K=[['Visitas terminadas',rs.length],['Borradores pendientes',all.length-rs.length],['Personas en las familias',sm(rs.map(r=>(r.d.fam||[]).length))],['Ingreso familiar promedio',money(Math.round(pr(TOT.ingreso)))],['Egreso mensual promedio',money(Math.round(pr(TOT.egreso)))],['Familias con deudas',pct(d=>d.deu=='Sí')],['Reciben algún apoyo',pct(d=>TOT.apoyos(d)>0)]];
 const G=[['Por trabajadora social',cntd(rs,r=>r.d.ts||'Sin dato')],['Por colonia',cntd(rs,r=>r.d.col||'Sin dato')],['Visitas por mes',Object.fromEntries(Object.entries(cntd(rs,r=>mlab(r.d.fecha),1)).map(([k,v])=>[mtxt(k),v]))],['Su casa es',cntd(rs,r=>r.d.casa||'Sin dato')],['Servicios con los que NO cuentan',cntd(rs,r=>['Agua','Luz','Drenaje','Internet','Computadora'].filter(x=>!(r.d.serv||[]).includes(x)))],['Apoyos que reciben',cntd(rs,r=>AP.filter(([k])=>num(r.d[k])>0).map(x=>x[2]))],['Asistencia médica',cntd(rs,r=>r.d.med||[])],['Hábitos alimenticios',cntd(rs,r=>r.d.alim||'Sin dato')],['Comidas al día',cntd(rs,r=>r.d.comidas||'Sin dato')],['Huerto familiar',cntd(rs,r=>r.d.huerto||'Sin dato')],['Higiene de la vivienda',cntd(rs,r=>r.d.hig||'Sin dato')],['Factores de riesgo',cntd(rs,r=>r.d.riesgo||[])]].filter(g=>Object.keys(g[1]).length);
 const per=(a||b)?`Del ${a?fd(a):'inicio'} al ${b?fd(b):fd(hoyISO())}`:'Todas las fechas';
 $('#vrb').innerHTML=`<p class="sub">${per}${t?' · '+h(t):''}${c?' · '+h(c):''}</p><div class="kp">${K.map(([l,v])=>`<div><b>${v}</b>${l}</div>`).join('')}</div>`+(rs.length?`<div class="grid">${G.map(([l,o])=>bars(l,o)).join('')}</div>`:'<p class="vacio">No hay visitas terminadas en ese periodo.</p>');
 VR={per,t,c,K,G,rs}}
function vrq(k){const d=new Date(),f=x=>x.toLocaleDateString('en-CA'),y=d.getFullYear(),m=d.getMonth();let a='',b='';
 if(k=='mes'){a=f(new Date(y,m,1));b=f(new Date(y,m+1,0))}else if(k=='ant'){a=f(new Date(y,m-1,1));b=f(new Date(y,m,0))}else if(k=='sem'){a=f(new Date(Date.now()-6*864e5));b=f(d)}else if(k=='anio'){a=y+'-01-01';b=y+'-12-31'}
 $('#vr1').value=a;$('#vr2').value=b;vrep()}
const kvh=(t,rows)=>kv(h(t),rows.map(([k,v])=>[h(k),h(v)]));
const vrHoja=()=>{const {per,t,c,K,G,rs}=VR,half=Math.ceil(G.length/2);
 return `<div class="pg"><div class="hd"><b class="lg">mese</b><h2>VISITAS DOMICILIARIAS · ${h(per.toUpperCase())}${t?' · '+h(t):''}${c?' · '+h(c):''}</h2></div><div class="gd"><div>${kvh('Resumen',K)}${G.slice(0,half).map(([l,o])=>kvh(l,Object.entries(o))).join('')}</div><div>${G.slice(half).map(([l,o])=>kvh(l,Object.entries(o))).join('')}</div></div></div>`
 +(rs.length?`<div class="pg"><table class="fi"><tr><th>Fecha<th>Participante<th>Colonia<th>Trabajadora social<th>Ingreso<th>Egreso</tr>${rs.map(r=>`<tr><td>${fd(r.d.fecha)}<td>${h(vnm(r.d))}<td>${h(r.d.col||'')}<td>${h(r.d.ts||'')}<td>${money(TOT.ingreso(r.d))}<td>${money(TOT.egreso(r.d))}</tr>`).join('')}</table></div>`:'')};

/* ---------- Ficha imprimible de una visita ---------- */
function ficha(r){const d=r.d,val=f=>{const v=d[f.k];let s=f.t=='mes'?(v?MES[v-1]:''):f.t=='mo'?(v?money(v):''):f.t=='dt'?(v?fd(v):''):Array.isArray(v)?v.join(', '):v??'';if(f.ot&&d[f.k+'_ot'])s+=(s?', ':'')+d[f.k+'_ot'];return h(s)};
 let ex='';const sec=s=>{let rows='';s.f.forEach(f=>{
  if(f.h)rows+=`<tr><th colspan=2 class="s2">${f.h}</th></tr>`;
  else if(f.tot)rows+=`<tr><td>${f.l}<td><b>${money(TOT[f.tot](d))}</b></tr>`;
  else if(f.t=='tb'){const L=d[f.k]||[];ex+=`<table class="fi"><tr><th colspan=${f.c.length}>${f.k=='fam'?'Integrantes de la familia':'Antecedentes médicos familiares'}</th></tr><tr>${f.c.map(c=>`<th>${c.l}`).join('')}</tr>${L.length?L.map(o=>`<tr>${f.c.map(c=>`<td>${h(c.t=='mo'&&o[c.k]?money(o[c.k]):c.t=='dt'?fd(o[c.k]||''):o[c.k]||'')}`).join('')}</tr>`).join(''):`<tr><td colspan=${f.c.length}>Sin registros</tr>`}</table>`}
  else if(f.t=='sig')rows+=`<tr><td>${f.l}<td>${d[f.k]?`<img src="${d[f.k]}" alt="Firma" style="max-height:70px;max-width:100%">`:''}</tr>`;
  else if(f.t=='gps')rows+=d.gps?`<tr><td>${f.l}<td>${h(d.gps)}</tr>`:'';
  else if(f.t!='bus')rows+=`<tr><td>${f.cl||f.l}<td>${val(f)}</tr>`});
  return rows?`<table class="fi"><tr><th colspan=2>${s.t}</th></tr>${rows}</table>`:''};const cuerpo=VS.map(sec).join('');
 return `<div class="pg"><div class="hd"><b class="lg">mese</b><h2>MESE VASCO DE QUIROGA I.A.P. · SEGUIMIENTO FAMILIAR<br><small>${h(vnm(d))} · ${fd(d.fecha)} · ${r.est}</small></h2></div><div class="fic">${cuerpo}</div>${ex}</div>`}

/* ---------- Respaldo y Excel ---------- */
const dlf=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.hidden=true;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const bkFile=()=>new File([JSON.stringify({app:'MESE',tipo:'visitas',version:1,exportado:new Date().toISOString(),visitas:V})],`MESE_visitas_respaldo_${hoyISO()}.json`,{type:'application/json'});
function vcsv(list,name){if(!list.length)return toast('No hay visitas para exportar');
 const cols=[['ID',r=>r.id],['Estado',r=>r.est],['Creado',r=>r.cr],['Modificado',r=>r.mod],
  ...VFS.filter(f=>f.k&&!['tb','sig'].includes(f.t)).flatMap(f=>{const g=r=>{const v=r.d[f.k];return f.t=='mes'&&v?MES[v-1]:Array.isArray(v)?v.join('; '):v??''};return f.ot?[[f.cl||f.l,g],[(f.cl||f.l)+' (otro)',r=>r.d[f.k+'_ot']||'']]:[[f.cl||f.l,g]]}),
  ['Nº de integrantes',r=>(r.d.fam||[]).length],['Integrantes',r=>(r.d.fam||[]).map(o=>[o.n,o.par,o.ed&&o.ed+' años',o.oc,o.ing&&'$'+o.ing].filter(Boolean).join(' / ')).join(' | ')],
  ['Antecedentes médicos',r=>(r.d.ant||[]).map(o=>[o.n,o.par,o.enf,o.at].filter(Boolean).join(' / ')).join(' | ')],
  ['Ingreso total',r=>TOT.ingreso(r.d)],['Total apoyos',r=>TOT.apoyos(r.d)],['Egreso total',r=>TOT.egreso(r.d)],['Balance',r=>TOT.balance(r.d)],
  ['Firma trabajadora social',r=>r.d.f_ts?'Sí':'No'],['Firma madre o tutor',r=>r.d.f_tu?'Sí':'No']];
 const q=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 dlf(new Blob(['﻿'+[cols.map(c=>q(c[0])).join(','),...list.map(r=>cols.map(c=>q(c[1](r))).join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'}),name)}
function ask(t,m,ok,fn){const d=$('#cf');$('#cft').textContent=t;$('#cfm').textContent=m;$('#cfo').textContent=ok;d.returnValue='';d.onclose=()=>{if(d.returnValue=='si')fn()};d.showModal()}
$('#vimp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.visitas;if(!Array.isArray(arr))throw 0;let n=0,u=0;
  arr.forEach(r=>{if(!r||!r.id||!r.d)return;const x=V.find(y=>y.id==r.id);if(!x){V.push(r);n++}else if((r.mod||'')>(x.mod||'')){Object.assign(x,r);u++}});
  vstore();vupd();toast(`Respaldo importado: ${n} nuevas, ${u} actualizadas`)}catch(er){toast('El archivo no es un respaldo válido de visitas')}};

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.vst)vgo(+d.vst);
 else if(d.vadd){const r=vrow(d.vadd);$('[data-c]',r).focus();vdirty=true;vauto()}
 else if(d.vdel!==undefined){const t=b.closest('[data-tb]');b.closest('.tr').remove();vnum(t.dataset.tb);vtot();vdirty=true;vauto()}
 else if(d.vsc){SIG[d.vsc]='';const c=$(`canvas[data-sig="${d.vsc}"]`);c.width=0;pads();vdirty=true;vauto()}
 else if(d.vgps!==undefined)vgps();
 else if(d.vgpsx!==undefined){$('#v-gps').value='';gpsT();vdirty=true;vauto()}
 else if(d.vver){const r=V.find(x=>x.id==d.vver);vview=r.id;$('#vvb').innerHTML=ficha(r);$('#vv').showModal()}
 else if(d.ved){vopen(d.ved);go('vform')}
 else if(d.vrm){const r=V.find(x=>x.id==d.vrm);ask('Eliminar visita',`Se borrará la visita de ${vnm(r.d)} (${fd(r.d.fecha)}) de este dispositivo. No se puede deshacer.`,'Eliminar',()=>{V=V.filter(x=>x.id!=r.id);vstore();vupd();toast('Visita eliminada')})}
 else if(d.vrq)vrq(d.vrq);
 else if(d.vv){$$('button',b.parentNode).forEach(x=>x.classList.toggle('on',x==b));$('#vl').hidden=d.vv!='l';$('#vg').hidden=d.vv!='g';$('#vr').hidden=d.vv!='r';$('#vfl').hidden=$('#vn').hidden=d.vv=='r';if(d.vv=='r')vrep()}
 else if(d.vx){const x=d.vx,r=vview&&V.find(y=>y.id==vview);switch(x){
  case 'new':{const p=vdraft();const nw=()=>{ls.del(VDK);vopen(null);go('vform')};p?ask('Hay una captura sin terminar',`Si empieza una nueva visita se perderá la captura de ${vnm(p.d||{})}.`,'Empezar nueva',nw):nw();break}
  case 'cont':{const p=vdraft();if(p){vopen(p.id,p);go('vform')}break}
  case 'desc':ask('Descartar captura','Se borrará lo capturado y no guardado.','Descartar',()=>{ls.del(VDK);vupd()});break;
  case 'salir':{const keep=vdirty||vcur.dr;go('visitas');if(keep)toast('La captura quedó pendiente; puede continuarla aquí');break}
  case 'prev':vgo(vstep-1);break;
  case 'next':vstep==VS.length-1?vsave(true):vgo(vstep+1);break;
  case 'draft':vsave(vcur.est=='Completa');break;
  case 'clr':$$('#vfl input,#vfl select').forEach(i=>i.value='');vupd();break;
  case 'vclose':$('#vv').close();break;
  case 'vedit':$('#vv').close();vopen(vview);go('vform');break;
  case 'vprint':case 'vpdf':imp(x=='vpdf',ficha(r),'Visita_'+vnm(r.d).replace(/\s+/g,'_'));break;
  case 'rprint':case 'rpdf':vrep();imp(x=='rpdf',vrHoja(),'Reporte_visitas_MESE');break;
  case 'rcsv':vrep();vcsv(VR.rs,`MESE_reporte_visitas_${hoyISO()}.csv`);break;
  case 'csv':vcsv(V,`MESE_visitas_${hoyISO()}.csv`);break;
  case 'bk':dlf(bkFile(),bkFile().name);ls.set('mese_bk',new Date().toISOString());vupd();toast('Respaldo descargado');break;
  case 'share':{const f=bkFile();navigator.share({files:[f],title:'Respaldo de visitas MESE',text:`Respaldo de ${V.length} visitas`}).then(()=>{ls.set('mese_bk',new Date().toISOString());vupd()}).catch(()=>{});break}
  case 'inst':if(vprompt){vprompt.prompt();vprompt=null;$('#vinst').hidden=true}break}}});
$('#vf').addEventListener('input',e=>{vdirty=true;const w=e.target.closest('.err');if(w)w.classList.remove('err');vtot();vauto()});
$('#vf').addEventListener('change',e=>{if(e.target.id=='v-bus')vbus(e.target.value);if(e.target.dataset.f=='ts'&&!$('#v-f_ts_n').value)$('#v-f_ts_n').value=e.target.value});
$('#vf').addEventListener('pointerdown',e=>{const l=e.target.closest('.ops label');if(l){const i=$('input',l);l.dataset.was=i.type=='radio'&&i.checked?'1':''}});
$('#vf').addEventListener('click',e=>{const i=e.target.closest('.ops input[type=radio]');if(i&&i.closest('label').dataset.was=='1'){i.checked=false;i.closest('label').dataset.was='';i.dispatchEvent(new Event('input',{bubbles:true}))}});
$('#visitas').addEventListener('input',e=>{if(e.target.closest('#vrf'))vrep();else if(e.target.closest('#vfl'))vupd()});
$('#rclr').onclick=()=>{$$('#r-activos .fl input,#r-activos .fl select').forEach(i=>i.value='');repo()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&vcur&&vdirty)vflush()});addEventListener('pagehide',()=>{if(vcur&&vdirty)vflush()});

/* ---------- Búsqueda global en Inicio ---------- */
$('#gq').addEventListener('input',()=>{const q=$('#gq').value,g=$('#gr');if(!nq(q)){g.hidden=true;return}
 const grp=[...Object.keys(P).map(p=>[p,P[p].t,DB[p].filter(r=>hit(r,q)),r=>r.n,r=>p=='familiares'?r.par+' de '+r.hijo:p=='bajas'?r.mot:p=='historico'?r.res:r.nv+' · '+(r.col||'')]),['visitas','Visitas domiciliarias',V.filter(r=>hit(r.d,q)),r=>vnm(r.d),r=>fd(r.d.fecha)+' · '+(r.d.col||'')]].filter(x=>x[2].length);
 g.hidden=false;g.innerHTML=grp.length?grp.map(([p,t,rs,a,b])=>`<h3>${t} (${rs.length})</h3>${rs.slice(0,5).map(r=>`<a href="#${p}" data-gp="${p}"><strong>${h(a(r))}</strong><span>${h(b(r))}</span></a>`).join('')}`).join(''):'<p class="vacio" style="padding:0">Sin resultados.</p>'});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-gp]');if(!a)return;const p=a.dataset.gp,q=$('#gq').value,inp=p=='visitas'?$('#vq'):$('#q-'+p);inp.value=q;p=='visitas'?vupd():upd(p)});

/* ---------- Sin conexión e instalación ---------- */
const netU=()=>{$('#net').hidden=navigator.onLine};addEventListener('online',netU);addEventListener('offline',netU);netU();
try{if(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]}))$('#vshare').hidden=false}catch(e){}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();vprompt=e;$('#vinst').hidden=false});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

addEventListener('hashchange',route);all();route();vload();
</script></body></html>
